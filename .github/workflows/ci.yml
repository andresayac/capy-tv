# Checks every change: on pushes to main and on pull requests. The sync server (with its image
# started and asked if it is up), the app's tests on Linux and Windows, the Samsung TV app, and
# that no key or password got into the code. Changes to text alone (READMEs, docs, the site) do
# not run it. Releases are built by release.yml.
#
# Actions are pinned to a commit (the version beside it); runners to an image version, so a
# check does not change by itself from one day to the next.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  secrets:
    name: No keys in the code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --verbose --no-banner

  server:
    name: Sync server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Known vulnerabilities in what the server calls, of its dependencies and of Go itself
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
      - name: Its image starts and answers
        run: |
          docker build -t capy-tv-sync .
          docker run -d --name sync -p 8080:8080 capy-tv-sync
          for i in $(seq 30); do
            curl -fs http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs sync
          exit 1

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The sync tests build and run the real server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The versions pubspec.lock says, not newer ones a release may have brought meanwhile
      - run: flutter pub get --enforce-lockfile
      # Once is enough for what does not depend on the system
      - name: Generated translations are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- lib/l10n
      - name: Formatting
        if: runner.os == 'Linux'
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - if: runner.os == 'Linux'
        run: flutter analyze
      - run: flutter test

  tizen:
    name: Samsung TV app
    # Its focus and player checks run in Edge, which Windows has
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tizen
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tizen/package-lock.json
      - run: npm ci
      # The build writes src/gen/ from the Flutter app's strings, icons and avatars: the types need it
      - run: node scripts/build.mjs
      - name: Types
        run: node node_modules/typescript/bin/tsc --noEmit -p .
      - name: The remote's focus
        run: node scripts/focus-test.mjs
      - name: The player
        run: node scripts/player-test.mjs
